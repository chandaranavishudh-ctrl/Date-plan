<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Let's Skip The Small Talk 🌸</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background-color: #fce4ec;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 10px;
        }
        .wrapper {
            position: relative;
            width: 100%;
            max-width: 960px;
            aspect-ratio: 16 / 9;
            background: url('cover.jpg') no-repeat center center;
            background-size: contain;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }
        /* Clickable area positioned precisely over the "Let's do this" button */
        .btn-overlay {
            position: absolute;
            top: 58.5%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 23%;
            height: 9.5%;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .btn-overlay:hover {
            transform: translate(-50%, -50%) scale(1.04);
            box-shadow: 0 4px 15px rgba(255, 105, 135, 0.4);
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <a href="page2.html" class="btn-overlay" aria-label="Let's do this"></a>
    </div>

</body>
</html>
