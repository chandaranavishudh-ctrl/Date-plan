<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Let's Skip the Small Talk</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            height: 100%;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #fce4ec;
            font-family: Arial, sans-serif;
        }
        .container {
            position: relative;
            width: 100%;
            max-width: 900px;
            aspect-ratio: 16 / 9;
            background: url('cover.jpg') no-repeat center center/contain;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .action-btn {
            position: absolute;
            top: 58%; /* Aligns over the 'Let's do this' button area */
            width: 22%;
            height: 9%;
            background: transparent;
            border: none;
            cursor: pointer;
            border-radius: 20px;
        }

<body>

    <div class="container">
        <a href="page2.html" class="action-btn" aria-label="Go to Page 2"></a>
    </div>
